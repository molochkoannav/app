{% extends 'base.html' %}
{% load static %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; padding: 10px 20px 15px 20px; box-sizing: border-box; min-height: 100vh; background: #f8f5fa;">

    <h1 class="page-title" style="text-align: center; margin-top: 3px; margin-bottom: 20px; font-size: 1.5rem; flex-shrink: 0; color: #2b1b40; font-weight: 700;">
        Удаление товара
    </h1>

    <div style="max-width: 600px; margin: 0 auto; width: 100%; background: #ffffff; border-radius: 14px; padding: 30px 25px; box-shadow: 0 2px 8px rgba(43, 27, 64, 0.1); border: 1px solid #e0d6e8;">

        <p style="font-size: 1rem; color: #2b1b40; line-height: 1.5; margin: 0 0 8px 0;">
            Вы уверены, что хотите удалить товар
            <strong>«{{ object.name_product }}»</strong>?
        </p>
        <p style="font-size: 0.85rem; color: #888; margin: 0 0 20px 0;">
            Это действие нельзя отменить.
        </p>

        <form method="post" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px;">
            {% csrf_token %}

            <button type="submit" style="flex: 1; min-width: 120px; padding: 12px 20px; background-color: #e74c3c; color: #ffffff; border: none; border-radius: 25px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s, transform 0.1s; letter-spacing: 0.5px;">
                Удалить
            </button>

            <a href="{% url 'catalog:catalog' %}" style="flex: 1; min-width: 120px; padding: 12px 20px; background-color: #f0ebf5; color: #2b1b40; border: 2px solid #2b1b40; border-radius: 25px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; text-align: center; text-decoration: none; display: block; letter-spacing: 0.5px;">
                Отмена
            </a>
        </form>
    </div>
</div>

<style>
    @media (max-width: 480px) {
        form[style*="flex-wrap: wrap"] {
            flex-direction: column;
        }
        form[style*="flex-wrap: wrap"] > * {
            min-width: unset !important;
            width: 100%;
        }
    }
</style>
{% endblock %}
