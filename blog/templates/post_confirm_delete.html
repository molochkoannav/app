{% extends 'base.html' %}
{% load static %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <!-- Хлебные крошки -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="{% url 'blog:post_list' %}">Блог</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">Удаление</li>
                </ol>
            </nav>

            <!-- Карточка подтверждения -->
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h1 class="h5 mb-0">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Подтверждение удаления
                    </h1>
                </div>
                <div class="card-body p-4">
                    <p class="mb-3">
                        Вы уверены, что хотите удалить пост
                        <strong>"{{ object.title }}"</strong>?
                    </p>
                    <div class="alert alert-warning mb-4">
                        <i class="bi bi-info-circle me-1"></i>
                        Это действие нельзя отменить.
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash me-1"></i>Да, удалить
                            </button>
                            <a href="{% url 'blog:post_list' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i>Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
