{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(43,27,64,0.1); border: 1px solid #e0d6e8;">
    <h1 style="text-align: center; color: #2b1b40; font-size: 1.5rem; margin-bottom: 20px;">Вход</h1>

    <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}

        {% if form.errors %}
            <div style="color: #e74c3c; font-size: 0.85rem;">
                Неверное имя пользователя или пароль.
            </div>
        {% endif %}

        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label for="{{ form.username.id_for_label }}" style="font-weight: 600; color: #2b1b40;">Имя пользователя</label>
            {{ form.username }}
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label for="{{ form.password.id_for_label }}" style="font-weight: 600; color: #2b1b40;">Пароль</label>
            {{ form.password }}
        </div>

        <button type="submit" style="padding: 12px; background: #2b1b40; color: #fff; border: none; border-radius: 25px; font-weight: 600; cursor: pointer;">
            Войти
        </button>
    </form>
</div>

<style>
    form input[type="text"], form input[type="password"] {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid #e0d6e8;
        border-radius: 10px;
        font-size: 0.95rem;
        background: #f8f5fa;
        box-sizing: border-box;
        font-family: inherit;
    }
    form input:focus {
        outline: none;
        border-color: #2b1b40;
        box-shadow: 0 0 0 3px rgba(43, 27, 64, 0.15);
        background: #fff;
    }
</style>
{% endblock %}
