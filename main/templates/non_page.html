<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        
        .fullscreen-bg {
            height: 100vh;
            width: 100vw;
            background-image: url("{% static 'deps/images/404.jpeg' %}");  /* Ваша картинка */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .overlay {
            background: rgba(0, 0, 0, 0.4);  /* Затемнение для читаемости текста */
            padding: 40px 60px;
            border-radius: 20px;
            color: white;
            text-align: center;
        }
        
        .overlay h1 {
            font-size: 100px;
            font-weight: 800;
        }
        
        .overlay .btn-light {
            background: white;
            color: #333;
            font-weight: 600;
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .overlay .btn-light:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 576px) {
            .overlay {
                padding: 20px 25px;
                margin: 20px;
            }
            .overlay h1 {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-bg">
        <div class="overlay">
            <h1>404</h1>
            <h2>Упс! Страница пропала</h2>
            <p class="mb-4">Возможно, она ушла в отпуск 🏖️</p>
            <a href="/" class="btn-light">Вернуться на главную</a>
        </div>
    </div>
</body>
</html>
